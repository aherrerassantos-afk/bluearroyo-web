<style>

  --white:#FFFFFF; --off:#F7F5F2; --dark:#0C0C0B;

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  background:var(--dark);color:var(--white);
  font-family:'Jost',sans-serif;font-weight:300;

}
.serif{font-family:'Cormorant Garamond',serif}

/* ── TOP BAR ── */
.prev-topbar{
  display:flex;align-items:center;justify-content:space-between;

}
.prev-logo{
  font-family:'Cormorant Garamond',serif;

  padding:32px var(--pad) 48px;
  gap:20px;
}
.prev-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.6rem,4vw,2.5rem);font-weight:300;
  text-align:center;line-height:1.2;
}
.prev-title em{font-style:italic;color:var(--gold)}
.prev-sub{
  font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.3);text-align:center;
}

/* ── CHATBOT overrides for standalone page ── */
.chat-toggle{display:none !important}
.chat-panel{
  position:relative !important;bottom:auto !important;right:auto !important;

/* ── CHATBOT ── */
.chat-toggle {
  position:fixed; bottom:32px; right:var(--pad); z-index:400;
  width:56px; height:56px;
  background:var(--gold); border:none; border-radius:50%;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 20px rgba(198,169,107,.45);
  transition:transform .3s, box-shadow .3s;
  font-family:'Cormorant Garamond',serif;
  font-size:1.1rem; font-weight:400; color:var(--dark);
  letter-spacing:.02em;
}
.chat-toggle:hover { transform:scale(1.1); box-shadow:0 6px 28px rgba(198,169,107,.6) }
.chat-toggle.open { background:var(--dark); color:var(--white); border:1px solid var(--gold) }

.chat-panel {
  position:fixed; bottom:104px; right:var(--pad); z-index:400;
  width:360px; max-height:560px;
  background:rgba(10,10,9,.97);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(198,169,107,.25);
  display:flex; flex-direction:column;
  transform:translateY(16px) scale(.96);
  opacity:0; pointer-events:none;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
.chat-panel.open { transform:translateY(0) scale(1); opacity:1; pointer-events:auto }

.chat-header {
  padding:16px 20px; border-bottom:1px solid rgba(255,255,255,.07);
  display:flex; justify-content:space-between; align-items:flex-start;
  flex-shrink:0;
}
.chat-header-title {
  font-family:'Cormorant Garamond',serif;
  font-size:1.05rem; font-weight:300; color:var(--white); line-height:1.2;
}
.chat-header-sub {
  font-size:8px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--gold); margin-top:3px;
}
.chat-close {
  background:none; border:none; color:rgba(255,255,255,.35);
  cursor:pointer; font-size:1.3rem; line-height:1;
  transition:color .2s; padding:0; margin-left:8px; flex-shrink:0;
}
.chat-close:hover { color:var(--white) }

.chat-messages {
  flex:1; overflow-y:auto; padding:16px 16px 8px;
  display:flex; flex-direction:column; gap:10px;
  scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar { width:3px }
.chat-messages::-webkit-scrollbar-track { background:transparent }
.chat-messages::-webkit-scrollbar-thumb { background:rgba(198,169,107,.3) }

.chat-bubble {
  max-width:88%; padding:10px 14px;
  font-size:.82rem; line-height:1.6; white-space:pre-wrap;
}
.chat-bubble.bot {
  background:rgba(198,169,107,.1); border:1px solid rgba(198,169,107,.18);
  color:rgba(255,255,255,.95); align-self:flex-start;
}
.chat-bubble.user {
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.88); align-self:flex-end;
}
.chat-bubble.summary {
  max-width:100%; background:rgba(198,169,107,.12);
  border:1px solid rgba(198,169,107,.3); color:var(--white);
  font-size:.84rem;
}
.chat-bubble.summary .summary-total {
  font-family:'Cormorant Garamond',serif;
  font-size:1.6rem; font-weight:300; color:var(--gold);
  display:block; margin-top:10px;
}
.chat-bubble.summary .summary-row {
  display:flex; justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.07);
  padding:6px 0; font-size:.8rem;
}
.chat-bubble.summary .summary-row:last-of-type { border-bottom:none }
.chat-bubble.summary .summary-divider {
  border-top:1px solid rgba(198,169,107,.3); margin:8px 0;
}
.chat-typing {
  align-self:flex-start;
  display:flex; gap:5px; align-items:center;
  padding:12px 16px; background:rgba(198,169,107,.08);
  border:1px solid rgba(198,169,107,.15);
}
.chat-typing span {
  width:5px; height:5px; border-radius:50%;
  background:var(--gold); opacity:.5;
  animation:typingDot 1.2s ease-in-out infinite;
}
.chat-typing span:nth-child(2) { animation-delay:.2s }
.chat-typing span:nth-child(3) { animation-delay:.4s }
@keyframes typingDot {
  0%,80%,100% { opacity:.3; transform:scale(.8) }
  40%          { opacity:1; transform:scale(1) }
}

.chat-question {
  padding:14px 18px 12px;
  border-top:1px solid rgba(198,169,107,.2);
  background:rgba(198,169,107,.06);
  flex-shrink:0;
  display:none;
}
.chat-question-text {
  font-family:'Cormorant Garamond',serif;
  font-size:1.05rem; font-weight:400; color:var(--white);
  line-height:1.35;
}
.chat-question.visible { display:block }

.chat-options {
  padding:10px 16px 14px; border-top:1px solid rgba(255,255,255,.06);
  display:flex; flex-wrap:wrap; gap:8px; flex-shrink:0; min-height:48px;
}
.chat-opt {
  font-family:'Jost',sans-serif; font-size:.78rem; letter-spacing:.06em;
  padding:8px 14px; border:1px solid rgba(255,255,255,.22);
  background:transparent; color:rgba(255,255,255,.85);
  cursor:pointer; transition:all .22s;
}
.chat-opt:hover { border-color:var(--gold); color:var(--gold) }
.chat-opt.primary {
  background:var(--gold); border-color:var(--gold); color:var(--dark); font-weight:400;
}
.chat-opt.primary:hover { background:var(--gold-l) }
.chat-opt.wa {
  background:#25D366; border-color:#25D366; color:var(--white);
  display:flex; align-items:center; gap:8px;
}
.chat-opt.wa:hover { background:#1da851; border-color:#1da851 }
.chat-typing.client-typing { align-self:flex-end; margin-left:auto; margin-right:0 }
.chat-input-row {
  display:flex; gap:8px; width:100%; align-items:center;
}
.chat-text-input {
  flex:1; background:rgba(255,255,255,.07); border:1px solid rgba(198,169,107,.35);
  border-radius:10px; color:var(--white); font-size:.82rem; padding:9px 12px;
  outline:none; transition:border-color .2s;
}
.chat-text-input::placeholder { color:rgba(255,255,255,.35) }
.chat-text-input:focus { border-color:var(--gold) }

@media (max-width:900px) {
  .chat-panel { width:calc(100vw - 32px); right:16px; bottom:88px }
  .chat-toggle { right:16px; bottom:24px }
}

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px) }
  to   { opacity:1; transform:translateY(0) }
}

/* ── MOBILE ── */
@media (max-width:900px) {
  .nav-links { display:none }
  .nav-hamburger { display:flex }
  nav { padding:0 20px }
  .nav-wa span { display:none }
  .scroll-video-wrapper { height:1750vh }
  .phase-pricing-grid { grid-template-columns:1fr }
  .pricing-kits-row { grid-template-columns:1fr }
  .phase-team-grid { grid-template-columns:1fr }
  .phase-values { grid-template-columns:1fr }
  .phase-partners { gap:28px }
  .phase-team-img { height:180px }
  .phase-title.xl { font-size:clamp(2.2rem, 8vw, 3.4rem) }
  .phase-title.lg { font-size:clamp(1.9rem, 6.5vw, 3rem) }
  .phase-title.md { font-size:clamp(1.6rem, 5vw, 2.6rem) }
  .phase-steps { grid-template-columns:1fr 1fr }
  .phase-testi-grid { grid-template-columns:1fr }
  .phase-checklist { grid-template-columns:1fr }
  .phase-checklist li:nth-child(odd) { border-right:none }
  .phase-contact-wrap { grid-template-columns:1fr }
  .phase-panel { padding:28px 20px }
  .phase-dots { right:10px }
  .wa-float { left:16px; bottom:24px; width:46px; height:46px }
  .pmf-row { grid-template-columns:1fr }
  .phase-stats { gap:28px }
  .phase-db-stats { gap:32px }
}

@media(max-width:520px){
  .chat-panel{max-width:100% !important}
}
</style>

<script>
/* ── LANG ── */
function setLang(l){
  document.documentElement.setAttribute('data-lang',l);
}
function fmt(n){ return '€ '+n.toFixed(2).replace('.',','); }

/* ══════════════════════════════════════════════════
   CHATBOT PREVENTIVATORE BLUE ARROYO
   ══════════════════════════════════════════════════ */
(function(){

var MQ = [
  { label:'25–40 m²',   price:30 },
  { label:'40–75 m²',   price:40 },
  { label:'75–110 m²',  price:50 },
  { label:'110–145 m²', price:60 },
  { label:'145–170 m²', price:75 }
];
var NUMS = ['0','1','2','3','4+'];

var state = {};
var serviceType = null;

function resetState(){
  state = { mq:null, matrimoniali:0, singoli:0, divaniMatri:0, divaniSingoli:0, bagniDoccia:0, bagniSenza:0, kitCucina:false, nome:'', email:'', contatto:'' };
  serviceType = null;
}
resetState();

/* ── Toggle panel ── */
window.toggleChat = function(){
  var panel  = document.getElementById('chatPanel');
  var toggle = document.getElementById('chatToggle');
  var isOpen = panel.classList.contains('open');
  panel.classList.toggle('open', !isOpen);
  toggle.classList.toggle('open', !isOpen);
  if(!isOpen && document.getElementById('chatMessages').children.length === 0){
    setTimeout(startChat, 400);
  }
};

function msgs(){ return document.getElementById('chatMessages'); }
function opts(){ return document.getElementById('chatOptions'); }
function scrollBottom(){ var m=msgs(); m.scrollTop=m.scrollHeight; }
function clearOpts(){ opts().innerHTML=''; }
function setQuestion(text){
  var q = document.getElementById('chatQuestion');
  var qt = document.getElementById('chatQuestionText');
  if(text){ qt.innerHTML = text; q.classList.add('visible'); }
  else { q.classList.remove('visible'); qt.innerHTML=''; }
}
function fmt(n){ return '€ '+n.toFixed(2).replace('.',','); }

function waIcon(){
  return '<svg width="13" height="13" viewBox="0 0 24 24" fill="white" style="flex-shrink:0"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';
}

/* Add bot bubble with typing indicator */
function addBubble(text, type, delay){
  delay = delay || 0;
  setTimeout(function(){
    var typing = document.createElement('div');
    typing.className = 'chat-typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    msgs().appendChild(typing);
    scrollBottom();
    setTimeout(function(){
      msgs().removeChild(typing);
      var b = document.createElement('div');
      b.className = 'chat-bubble ' + (type||'bot');
      b.innerHTML = text;
      msgs().appendChild(b);
      scrollBottom();
    }, 700);
  }, delay);
}

/* Add user bubble directly */
function addUserBubble(text){
  var b = document.createElement('div');
  b.className = 'chat-bubble user';
  b.textContent = text;
  msgs().appendChild(b);
  scrollBottom();
}

/* Simulate client typing dots (right-aligned) then fire callback */
function clientTyping(callback){
  var typing = document.createElement('div');
  typing.className = 'chat-typing client-typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  msgs().appendChild(typing);
  scrollBottom();
  setTimeout(function(){
    msgs().removeChild(typing);
    callback();
  }, 1800);
}

function addOpts(options){
  clearOpts();
  options.forEach(function(o){
    var btn = document.createElement('button');
    btn.className = 'chat-opt' + (o.cls ? ' '+o.cls : '');
    btn.innerHTML = o.label;
    btn.onclick = o.action;
    opts().appendChild(btn);
  });
}

/* ── Entry point ── */
function startChat(){
  resetState();
  clearOpts();
  msgs().innerHTML = '';
  clientTyping(function(){
    addUserBubble('Salve, volevo chiedere un preventivo dei vostri servizi di pulizie');
    setTimeout(function(){
      addBubble('Ciao! 😊 Siamo felici di aiutarti.\n\nChe tipologia di pulizie ti interessa?', 'bot', 500);
      setTimeout(showServiceTypes, 1900);
    }, 400);
  });
}

/* ── Step 1: Service type ── */
function showServiceTypes(){
  addOpts([
    { label: '1. Pulizie post long term',              action: function(){ selectService('longterm');   }},
    { label: '2. Pulizie standard post check-out',     cls:'primary', action: function(){ selectService('checkout');  }},
    { label: '3. Riassetto con ospiti dentro',         action: function(){ selectService('riassetto');  }},
    { label: '4. Spolverata dopo periodo vuoto',       action: function(){ selectService('spolverata'); }}
  ]);
}

var serviceLabels = {
  longterm:   'Pulizie post long term',
  checkout:   'Pulizie standard post check-out',
  riassetto:  'Riassetto con ospiti dentro',
  spolverata: 'Spolverata dopo periodo vuoto'
};

function selectService(type){
  serviceType = type;
  clearOpts();
  addUserBubble(serviceLabels[type]);
  if(type === 'checkout'){
    addBubble('Perfetto! 🏡 Calcoliamo il preventivo.', 'bot', 500);
    setTimeout(function(){ setQuestion('📐 Quanti m² ha l\'appartamento?'); showMqOptions(); }, 1800);
  } else {
    setQuestion(''); addBubble('Ottima scelta! 👍 Prepariamo un\'offerta su misura.\n\nCome ti chiami?', 'bot', 500);
    setTimeout(showNameInput, 1800);
  }
}

/* ── m² → beds → kits (checkout only) ── */
function showMqOptions(){
  addOpts(MQ.map(function(m){
    return { label: m.label, action: function(){
      state.mq = m;
      addUserBubble(m.label);

/* ── Quote summary (checkout) ── */
function calcQuote(){
  var rows=[], extras=[], total=0;
  var mo = state.mq.price; total += mo;
  rows.push({ label:'Mano d\'opera + prodotti ('+state.mq.label+')', price:mo });
  if(state.matrimoniali>0){
    var bm=25+(state.matrimoniali-1)*15; total+=bm;
    rows.push({ label:state.matrimoniali+(state.matrimoniali>1?' letti matrimoniali':' letto matrimoniale')+' (biancheria incl.)', price:bm });
  }
  if(state.singoli>0){
    var bs=state.singoli*11; total+=bs; // Letto singolo: updated from €10 to €11
    rows.push({ label:state.singoli+(state.singoli>1?' letti singoli':' letto singolo')+' (biancheria incl.)', price:bs });
  }
  var totalBagni = (state.bagniDoccia||0) + (state.bagniSenza||0);
  var kitBagnoExtra = Math.max(0, totalBagni - 1);
  if(kitBagnoExtra>0){
    var kb=kitBagnoExtra*3; total+=kb;
    rows.push({ label:kitBagnoExtra+' kit bagno extra (1° già incluso)', price:kb });
  }
  if(state.kitCucina){ rows.push({ label:'Kit Cucina (Sempre incluso)', price:0 }); } // Kitchen kit: always included, price €0
  /* Divani letto = extra, NON inclusi nel totale */
  if(state.divaniMatri>0){
    extras.push({ label:state.divaniMatri+(state.divaniMatri>1?' divani letto matrimoniali':' divano letto matrimoniale')+' — biancheria incl.', price:state.divaniMatri*18 });
  }
  if(state.divaniSingoli>0){
    extras.push({ label:state.divaniSingoli+(state.divaniSingoli>1?' divani letto singoli':' divano letto singolo')+' — biancheria incl.', price:state.divaniSingoli*12 });
  }
  return { rows:rows, extras:extras, total:total };
}
